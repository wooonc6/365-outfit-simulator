<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>365 미니멀 코디 시뮬레이터</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel intro">
        <div>
          <p class="eyebrow">26벌 캡슐 옷장</p>
          <h1>365일 코디 시뮬레이터</h1>
          <p class="summary">
            상의, 하의, 레이어를 직접 눌러 조합하고 계절별 가능한 코디 수를 확인해보세요.
          </p>
        </div>
        <div class="scoreboard">
          <div>
            <span id="totalItems">26</span>
            <small>총 아이템</small>
          </div>
          <div>
            <span id="validCount">0</span>
            <small>현재 조건 조합</small>
          </div>
          <div>
            <span id="coverage">0%</span>
            <small>필요 일수 커버</small>
          </div>
        </div>
      </section>

      <section class="toolbar panel">
        <div class="season-tabs" role="tablist" aria-label="계절 선택">
          <button class="season active" data-season="spring">봄/가을</button>
          <button class="season" data-season="summer">여름</button>
          <button class="season" data-season="winter">겨울</button>
        </div>
        <label class="switch">
          <input id="layerToggle" type="checkbox" checked />
          <span>레이어 활용</span>
        </label>
      </section>

      <section class="workspace">
        <aside class="panel closet">
          <div class="section-head">
            <h2>아이템 선택</h2>
            <button id="resetBtn" type="button">초기화</button>
          </div>
          <div id="tops" class="item-group"></div>
          <div id="bottoms" class="item-group"></div>
          <div id="layers" class="item-group"></div>
        </aside>

        <section class="panel simulator">
          <div class="section-head">
            <h2>오늘의 조합</h2>
            <button id="randomBtn" type="button">랜덤</button>
          </div>
          <div class="outfit-stage">
            <div id="outfitPreview" class="person" aria-label="코디 미리보기"></div>
            <div class="verdict">
              <strong id="verdictIcon">◎</strong>
              <span id="verdictText">매우 잘 어울림</span>
              <p id="comboName"></p>
            </div>
          </div>
          <div class="metrics">
            <div>
              <span id="seasonNeed">183</span>
              <small>필요 일수</small>
            </div>
            <div>
              <span id="seasonCombos">0</span>
              <small>생성 가능</small>
            </div>
            <div>
              <span id="repeatRate">0</span>
              <small>평균 반복</small>
            </div>
          </div>
        </section>

        <section class="panel matrix">
          <div class="section-head">
            <h2>색상 매칭표</h2>
            <span class="legend">◎ 최고 · ○ 가능 · △ 고민 · × 제외</span>
          </div>
          <div id="matrixGrid" class="matrix-grid"></div>
        </section>
      </section>

      <section class="panel calendar-panel">
        <div class="section-head">
          <h2>365일 배치 시뮬레이션</h2>
          <button id="generateBtn" type="button">다시 섞기</button>
        </div>
        <div id="calendar" class="calendar"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
